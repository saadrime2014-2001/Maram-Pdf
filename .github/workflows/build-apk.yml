name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Waraqa PDF APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install web dependencies
        run: npm install

      - name: Build web bundle
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Install Capacitor & generate Android project
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: Copy app icons to Android resources
        run: |
          for density in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            folder="${density%%:*}"
            size="${density##*:}"
            mkdir -p "android/app/src/main/res/mipmap-${folder}"
            convert public/pwa-512x512.png -resize "${size}x${size}" "android/app/src/main/res/mipmap-${folder}/ic_launcher.png"
            convert public/pwa-maskable-512x512.png -resize "${size}x${size}" "android/app/src/main/res/mipmap-${folder}/ic_launcher_round.png"
            convert public/pwa-maskable-512x512.png -resize "${size}x${size}" "android/app/src/main/res/mipmap-${folder}/ic_launcher_foreground.png"
          done

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: waraqa-pdf-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
