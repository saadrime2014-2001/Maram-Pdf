name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Waraqa PDF APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install web dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Install Capacitor & generate Android project
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap add android
          npx cap sync android

      - name: Configure Permissions, Zoom & Open With (Abrir con) for PDF
        run: |
          python3 - << 'EOF'
          import glob

          # 1. تعديل AndroidManifest.xml لإضافة الأذونات وميزة فتح ملفات PDF
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              manifest = f.read()

          permissions = """
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
          """
          if "WRITE_EXTERNAL_STORAGE" not in manifest:
              manifest = manifest.replace("<application", permissions + "\n    <application", 1)

          pdf_intent = """
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="content" />
                          <data android:scheme="file" />
                          <data android:mimeType="application/pdf" />
                      </intent-filter>
          """
          if "application/pdf" not in manifest:
              manifest = manifest.replace("</activity>", pdf_intent + "\n        </activity>", 1)

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(manifest)

          # 2. تعديل MainActivity.java لتفعيل الزووم واستقبال رابط الملف
          main_activities = glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True)
          for ma_path in main_activities:
              with open(ma_path, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              pkg_line = next((l for l in lines if l.startswith("package ")), "package com.waraqa.pdf;\n")
              new_code = f"""{pkg_line}
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import java.net.URLEncoder;

          public class MainActivity extends BridgeActivity {{
              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  WebView webView = getBridge().getWebView();
                  WebSettings settings = webView.getSettings();
                  settings.setSupportZoom(true);
                  settings.setBuiltInZoomControls(true);
                  settings.setDisplayZoomControls(false);
                  handleIncomingIntent(getIntent());
              }}

              @Override
              protected void onNewIntent(Intent intent) {{
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleIncomingIntent(intent);
              }}

              private void handleIncomingIntent(Intent intent) {{
                  if (intent != null && Intent.ACTION_VIEW.equals(intent.getAction())) {{
                      Uri data = intent.getData();
                      if (data != null && getBridge() != null && getBridge().getWebView() != null) {{
                          try {{
                              String encodedUri = URLEncoder.encode(data.toString(), "UTF-8");
                              String js = "window.location.href = '/?openPdfUri=" + encodedUri + "';";
                              getBridge().getWebView().post(() -> getBridge().getWebView().evaluateJavascript(js, null));
                          }} catch (Exception e) {{
                              e.printStackTrace();
                          }}
                      }}
                  }}
              }}
          }}
          """
              with open(ma_path, "w", encoding="utf-8") as f:
                  f.write(new_code)
          EOF

      - name: Copy app icons to Android resources
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          for density in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            folder="${density%%:*}"
            size="${density##*:}"
            mkdir -p "android/app/src/main/res/mipmap-${folder}"
            convert public/pwa-512x512.png -resize "${size}x${size}" "android/app/src/main/res/mipmap-${folder}/ic_launcher.png"
            convert public/pwa-maskable-512x512.png -resize "${size}x${size}" "android/app/src/main/res/mipmap-${folder}/ic_launcher_round.png"
            convert public/pwa-maskable-512x512.png -resize "${size}x${size}" "android/app/src/main/res/mipmap-${folder}/ic_launcher_foreground.png"
          done

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: waraqa-pdf-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
